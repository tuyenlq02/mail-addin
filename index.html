<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#E53E3E"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>VietQR Global Finder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#ddd;font-family:'Segoe UI',Roboto,sans-serif}
#app{height:100svh;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
:root{--red:#E53E3E;--redd:#C53030;--text:#111827;--sub:#6b7280;--bdr:#e5e7eb;--bg:#f9fafb}
.ab{background:var(--red);padding:10px 14px 12px;flex-shrink:0;color:#fff}
.ab-row{display:flex;align-items:center;gap:10px}
.ab-logo{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.logo-img{height:26px;width:auto;object-fit:contain}
.ab h1{font-size:15px;font-weight:700;flex:1}
.ab-sub{font-size:11px;opacity:.78;margin-top:2px}
.ib{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:rgba(255,255,255,.9);font-size:20px;display:flex;align-items:center}
.ib:active{background:rgba(255,255,255,.18)}
.srch{background:rgba(255,255,255,.2);border-radius:24px;padding:7px 13px;display:flex;align-items:center;gap:7px;margin-top:9px}
.srch input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px;font-family:inherit}
.srch input::placeholder{color:rgba(255,255,255,.6)}
#clrBtn{display:none;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.8);font-size:15px;padding:0}
.chips{display:flex;gap:5px;padding:8px 12px 7px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bdr);flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;border:1.5px solid var(--bdr);background:var(--bg);color:var(--sub);font-weight:600;user-select:none}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.chip:active{opacity:.7}
#mapWrap{height:220px;flex-shrink:0;position:relative;overflow:hidden;background:#dce8f0}
#mapSvg{width:100%;height:100%}
.mfabs{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.fab{width:36px;height:36px;border-radius:50%;background:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.fab:active{transform:scale(.92)}
#bs{flex:1;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid var(--bdr)}
.bs-handle{display:none}
#bsCount{font-size:12px;color:var(--sub);padding:8px 15px 5px;font-weight:600;flex-shrink:0;border-bottom:1px solid var(--bdr);background:#fff}
#bsList{overflow-y:auto;flex:1;scrollbar-width:none}
#bsList::-webkit-scrollbar{display:none}
.pc{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid #f3f4f6;cursor:pointer}
.pc:active{background:#fff5f5}
.pc-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pc-info{flex:1;min-width:0}
.pc-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{font-size:11px;color:var(--sub);margin-top:2px}
.pc-r{text-align:right;flex-shrink:0}
.pc-flags{font-size:13px;letter-spacing:1px}
.bo{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:600;display:inline-block;margin-top:2px}
.bo.op{background:#dcfce7;color:#166534}
.bo.cl{background:#fee2e2;color:#991b1b}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;z-index:20;transition:transform .28s ease,opacity .28s}
.scr.off{transform:translateX(100%);opacity:0;pointer-events:none}
.det-body{flex:1;overflow-y:auto;background:var(--bg);scrollbar-width:none}
.det-body::-webkit-scrollbar{display:none}
.det-hero{background:#fff;padding:18px 16px 14px;margin-bottom:8px}
.det-ico{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:10px}
.det-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:3px}
.det-type{font-size:12px;color:var(--sub);margin-bottom:9px}
.det-flags{font-size:20px;letter-spacing:4px;margin-bottom:9px}
.ltags{display:flex;gap:5px;flex-wrap:wrap}
.ltag{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700}
.lko{background:#EBF8FF;color:#2B6CB0}.lcn{background:#FFF5F5;color:#C53030}
.lja{background:#FAF5FF;color:#553C9A}.len{background:#FFFBEB;color:#92400E}
.lvi{background:#FFF5F5;color:#E53E3E}.lth{background:#F0FFF4;color:#276749}
.act-row{display:flex;gap:8px;padding:10px 15px;background:#fff;margin-bottom:8px}
.abt{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
.abt:active{opacity:.75}
.abt.p{background:var(--red);color:#fff}
.abt.s{background:var(--bg);color:var(--text);border:1px solid var(--bdr)}
.dsec{background:#fff;margin-bottom:8px;padding:0 15px}
.dsec-t{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;padding:11px 0 5px;border-bottom:1px solid var(--bdr)}
.irow{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.irow:last-child{border:none}
.ii{font-size:15px;width:20px;text-align:center;flex-shrink:0;margin-top:1px}
.il{color:var(--sub);font-size:11px;margin-bottom:2px}
.iv{color:var(--text);font-weight:500}
.qhint{background:#fffbeb;border-radius:9px;padding:11px;margin:0 15px 12px;font-size:12px;color:#92400E;line-height:1.6}
.lb{flex:1;overflow-y:auto;scrollbar-width:none}
.lb::-webkit-scrollbar{display:none}
.lsh{padding:6px 15px 4px;font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--bdr);position:sticky;top:0}
.scan-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;padding:28px 22px;gap:18px}
.sf{width:200px;height:200px;border-radius:14px;border:3px solid var(--red);position:relative;display:flex;align-items:center;justify-content:center}
.sc{position:absolute;width:22px;height:22px;border-color:var(--red);border-style:solid;border-width:0}
.stl{top:-2px;left:-2px;border-top-width:4px;border-left-width:4px;border-radius:3px 0 0 0}
.str{top:-2px;right:-2px;border-top-width:4px;border-right-width:4px;border-radius:0 3px 0 0}
.sbl{bottom:-2px;left:-2px;border-bottom-width:4px;border-left-width:4px;border-radius:0 0 0 3px}
.sbr{bottom:-2px;right:-2px;border-bottom-width:4px;border-right-width:4px;border-radius:0 0 3px 0}
.sl{position:absolute;left:10px;right:10px;height:2px;background:var(--red);animation:sl 2s linear infinite}
@keyframes sl{0%{top:10px}100%{top:calc(100% - 10px)}}
.sh{color:rgba(255,255,255,.8);font-size:13px;text-align:center;line-height:1.6}
.sr{background:#fff;border-radius:12px;padding:14px;width:100%}
.sr-t{font-size:13px;font-weight:700;margin-bottom:7px}
.sr-tags{display:flex;gap:5px;flex-wrap:wrap}
.st{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;background:#f0f4ff;color:#1a237e}
.sbtn{padding:11px 26px;background:var(--red);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.sbtn:active{background:var(--redd)}
.sv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:40px;color:var(--sub);text-align:center}
.sv-empty .bi{font-size:52px}
#ob{position:absolute;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px}
.ob-flag{font-size:48px;margin-bottom:14px}
.ob-h{font-size:22px;font-weight:800;color:var(--text);text-align:center;margin-bottom:7px}
.ob-s{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;margin-bottom:24px}
.lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-bottom:22px}
.lgb{padding:11px;border:2px solid var(--bdr);border-radius:11px;background:#fff;cursor:pointer;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:all .15s}
.lgb span{font-size:11px;font-weight:600;color:var(--sub)}
.lgb.sel{border-color:var(--red);background:#fff5f5}
.lgb.sel span{color:var(--red)}
.stbtn{width:100%;padding:13px;background:var(--red);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.stbtn:active{background:var(--redd)}
.nav{background:#fff;border-top:1px solid var(--bdr);display:flex;flex-shrink:0;z-index:15}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;color:var(--sub);background:none;border:none;cursor:pointer;font-family:inherit}
.nb.on{color:var(--red)}
.nb:active{opacity:.7}
.nbi{font-size:21px}
.nbdg{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:0 4px;border-radius:8px;min-width:14px;text-align:center;line-height:14px;display:none;margin-left:-6px;margin-top:-14px;position:relative;top:-2px}
.bkb{background:rgba(255,255,255,.2);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex-shrink:0}
.bkb:active{background:rgba(255,255,255,.3)}
#toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a2e;color:#fff;padding:9px 17px;border-radius:22px;font-size:12px;opacity:0;transition:all .25s;z-index:200;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <!-- APPBAR (hidden until lang selected) -->

  {id:11,name:"Bún Đậu Mắm Tôm",ko:"분더우맘텀",cat:"restaurant",ico:"🍲",lat:10.7721,lng:106.7065,addr:"22 Võ Văn Tần, Q.3",hrs:"10:00–21:00",ph:"090 987 6543",qr:["kr"],lang:["ko","en"],open:true,r:4.4,rv:289,sx:305,sy:232},
  {id:12,name:"Circle K 24h",ko:"써클K",zh:"便利店",cat:"shopping",ico:"🏪",lat:10.7765,lng:106.7042,addr:"78 Đinh Tiên Hoàng, Q.BT",hrs:"24h",ph:"",qr:["kr","cn","jp","sg","la","th"],lang:["en"],open:true,r:3.9,rv:156,sx:228,sy:150},
  {id:13,name:"Seoul BBQ & Beer",ko:"서울 바베큐",cat:"restaurant",ico:"🥩",lat:10.7785,lng:106.7001,addr:"33 Phan Văn Trị, Q.BT",hrs:"16:00–24:00",ph:"028 3553 7788",qr:["kr","cn"],lang:["ko","zh"],open:true,r:4.3,rv:432,sx:126,sy:107},
  {id:14,name:"Ramen Ichiban",ko:"라멘 이치반",ja:"ラーメン一番",cat:"restaurant",ico:"🍜",lat:10.7774,lng:106.7052,addr:"67 Nguyễn Hữu Cảnh, Q.BT",hrs:"11:00–22:00",ph:"028 3510 6767",qr:["jp","kr"],lang:["ja","ko","en"],open:true,r:4.5,rv:377,sx:255,sy:167},
  {id:15,name:"Lotteria Vincom",ko:"롯데리아",cat:"restaurant",ico:"🍔",lat:10.7951,lng:106.7222,addr:"B1F Vincom Landmark 81",hrs:"09:30–22:00",ph:"028 3938 1234",qr:["kr","cn","jp","sg"],lang:["ko","en"],open:true,r:4.0,rv:654,sx:362,sy:200},
];

var lang="ko", saved=[], qrf="all", catf="all", curScr="Map", prevScr="Map";
var uLat=10.7769, uLng=106.7009;

// INIT — synchronous, no loading screen needed
(function(){
  try{ var l=localStorage.getItem("vqg_lang"); if(l) lang=l; }catch(e){}
  try{ saved=JSON.parse(localStorage.getItem("vqg_saved")||"[]"); }catch(e){}
  if(localStorage.getItem("vqg_lang")){
    document.getElementById("ob").style.display="none";
    showMainUI();
  }
})();

function showMainUI(){
  document.getElementById("mainAb").style.display="block";
  document.getElementById("qrChips").style.display="flex";
  document.getElementById("mapWrap").style.display="flex";
  document.getElementById("bs").style.display="flex";
  document.getElementById("nav").style.display="flex";
  applyLang();
  renderPins();
  renderBS();
  updateBdg();
}

function t(k){ return (T[lang]||T.en)[k]||k; }

function selLang(l,btn){
  lang=l;
  document.querySelectorAll(".lgb").forEach(function(b){b.classList.remove("sel");});
  btn.classList.add("sel");
  document.getElementById("stbtn").textContent=(T[l]||T.en).stBtn;
}

function startApp(){
  try{localStorage.setItem("vqg_lang",lang);}catch(e){}
  document.getElementById("ob").style.display="none";
  showMainUI();
}

function applyLang(){
  document.getElementById("abSub").textContent=t("sub");
  document.getElementById("si").placeholder=t("sp");
  if(document.getElementById("lsi")) document.getElementById("lsi").placeholder=t("sp");
  document.getElementById("lgFlag").textContent=FLAGS[lang]||"🌏";
  document.getElementById("nlMap").textContent=t("nm");
  document.getElementById("nlList").textContent=t("nl");
  document.getElementById("nlScan").textContent=t("ns");
  document.getElementById("nlSaved").textContent=t("nv");
  document.getElementById("scanT").textContent=t("scanT");
  document.getElementById("scanH").innerHTML=t("scanH")+'<br><small style="opacity:.65;font-size:11px">VietQR · UnionPay · Alipay · WeChat Pay</small>';
  document.getElementById("savedT").textContent=t("nv");
  document.getElementById("listT").textContent=t("lt");
}

function openLangPick(){
  var ll=Object.keys(FLAGS);
  var opts=ll.map(function(l,i){return (i+1)+". "+FLAGS[l]+" "+l.toUpperCase();}).join("\n");
  var r=prompt("Language:\n"+opts);
  if(!r) return;
  var picked=ll[parseInt(r)-1];
  if(picked){ lang=picked; try{localStorage.setItem("vqg_lang",lang);}catch(e){} applyLang(); renderPins(); renderBS(); renderList(); }
}

function getName(p){
  if(lang==="ko"&&p.ko) return p.ko;
  if(lang==="zh"&&p.zh) return p.zh;
  if(lang==="ja"&&p.ja) return p.ja;
  return p.name;
}

function dst(a,b){ return Math.round(111320*Math.sqrt(Math.pow(a.lat-b.lat,2)+Math.pow((a.lng-b.lng)*Math.cos(a.lat*Math.PI/180),2))); }
function fmtD(d){ return d<1000?d+"m":(d/1000).toFixed(1)+"km"; }
function catBg(c){ return {cafe:"#fefce8",restaurant:"#f0fff4",shopping:"#eff6ff",hotel:"#faf5ff",pharmacy:"#fef2f2"}[c]||"#f9fafb"; }
function catLbl(c){
  var m={cafe:{vi:"Cà phê",ko:"카페",zh:"咖啡",ja:"カフェ",en:"Cafe",th:"คาเฟ่"},restaurant:{vi:"Nhà hàng",ko:"식당",zh:"餐厅",ja:"レストラン",en:"Restaurant",th:"ร้านอาหาร"},shopping:{vi:"Mua sắm",ko:"쇼핑",zh:"购物",ja:"ショッピング",en:"Shopping",th:"ช้อปปิ้ง"},hotel:{vi:"Khách sạn",ko:"호텔",zh:"酒店",ja:"ホテル",en:"Hotel",th:"โรงแรม"},pharmacy:{vi:"Nhà thuốc",ko:"약국",zh:"药店",ja:"薬局",en:"Pharmacy",th:"ร้านขายยา"}};
  return (m[c]||{})[lang]||c;
}

function filtered(){
  var q=(document.getElementById("si")||{value:""}).value.trim().toLowerCase();
  return PLACES.filter(function(p){
    if(qrf!=="all"&&p.qr.indexOf(qrf)<0) return false;
    if(catf!=="all"&&p.cat!==catf) return false;
    if(q&&getName(p).toLowerCase().indexOf(q)<0&&p.addr.toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){return dst({lat:uLat,lng:uLng},a)-dst({lat:uLat,lng:uLng},b);});
}

function renderPins(){
  var data=filtered();
  var g=document.getElementById("pins");
  if(!g) return;
  g.innerHTML="";
  data.forEach(function(p){
    var c=p.qr.length>1?"#B7791F":(PINC[p.qr[0]]||"#666");
    var lbl=getName(p);
    if(lbl.length>12) lbl=lbl.substring(0,12)+"…";
    var tw=Math.max(62, lbl.length*6.5+22);
    var bx=Math.min(Math.max(p.sx-tw/2, 2), 398-tw);
    var el=document.createElementNS("http://www.w3.org/2000/svg","g");
    el.setAttribute("style","cursor:pointer");
    el.setAttribute("onclick","openDet("+p.id+")");
    var op=p.open?1:0.55;
    el.innerHTML='<rect x="'+bx+'" y="'+(p.sy-22)+'" width="'+tw+'" height="18" rx="5" fill="'+c+'" opacity="'+op+'"/>'
      +'<text x="'+(bx+tw/2)+'" y="'+(p.sy-10)+'" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="700" font-family="sans-serif">'+p.ico+' '+lbl+'</text>'
      +'<polygon points="'+(p.sx-3)+','+(p.sy-4)+' '+(p.sx+3)+','+(p.sy-4)+' '+p.sx+','+(p.sy+2)+'" fill="'+c+'" opacity="'+op+'"/>'
      +'<circle cx="'+p.sx+'" cy="'+(p.sy+4)+'" r="2.5" fill="#fff" stroke="'+c+'" stroke-width="1.5"/>';
    g.appendChild(el);
  });
}

function pcHtml(p){
  var d=fmtD(dst({lat:uLat,lng:uLng},p));
  var flags=p.qr.map(function(q){return QRC[q]||"";}).join("");
  var badge=p.open?'<span class="bo op">'+t("op")+'</span>':'<span class="bo cl">'+t("cl")+'</span>';
  return '<div class="pc" onclick="openDet('+p.id+')">'
    +'<div class="pc-ico" style="background:'+catBg(p.cat)+'">'+p.ico+'</div>'
    +'<div class="pc-info"><div class="pc-name">'+getName(p)+'</div><div class="pc-meta">'+catLbl(p.cat)+' · '+d+'</div></div>'
    +'<div class="pc-r"><div class="pc-flags">'+flags+'</div>'+badge+'</div></div>';
}

function renderBS(){
  var list=filtered();
  document.getElementById("bsCount").textContent=list.length+" "+t("ps");
  var html=list.slice(0,8).map(pcHtml).join("");
  document.getElementById("bsList").innerHTML=html||'<div style="padding:22px;text-align:center;color:var(--sub);font-size:13px">—</div>';
}

function openDet(id){
  var p=PLACES.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  prevScr=curScr;
  var flags=p.qr.map(function(q){return QRC[q]||"";}).join(" ");
  var ltags=p.lang.map(function(l,i){
    var n={ko:"한국어",zh:"中文",ja:"日本語",en:"English",vi:"Tiếng Việt",th:"ภาษาไทย"}[l]||l;
    return '<span class="ltag l'+p.lang[i]+'">'+n+'</span>';
  }).join("");
  var isSv=saved.indexOf(id)>=0;
  document.getElementById("detT").textContent=t("det");
  document.getElementById("detBody").innerHTML=
    '<div class="det-hero">'
    +'<div class="det-ico" style="background:'+catBg(p.cat)+'">'+p.ico+'</div>'
    +'<div class="det-name">'+getName(p)+'</div>'
    +'<div class="det-type">'+catLbl(p.cat)+' · ⭐ '+p.r+' ('+p.rv+')</div>'
    +'<div class="det-flags">'+flags+'</div>'
    +'<div class="ltags">'+ltags+'</div></div>'
    +'<div class="act-row">'
    +'<button class="abt p" onclick="openMaps('+p.lat+','+p.lng+')">📍 '+t("dir")+'</button>'
    +'<button class="abt s" id="svBtn" onclick="togSave('+id+')">'+(isSv?"⭐ "+t("unsv"):"☆ "+t("sv"))+'</button>'
    +'<button class="abt s" onclick="doShare('+id+')">↗ '+t("sh")+'</button></div>'
    +'<div class="dsec"><div class="dsec-t">'+t("addr")+'</div>'
    +'<div class="irow"><span class="ii">📍</span><div><div class="il">'+t("addr")+'</div><div class="iv">'+p.addr+'</div></div></div>'
    +'<div class="irow"><span class="ii">🕐</span><div><div class="il">'+t("hrs")+'</div><div class="iv">'+p.hrs+' · <b style="color:'+(p.open?"#276749":"#C53030")+'">'+(p.open?t("op"):t("cl"))+'</b></div></div></div>'
    +(p.ph?'<div class="irow"><span class="ii">📞</span><div><div class="il">'+t("ph")+'</div><div class="iv">'+p.ph+'</div></div></div>':"")
    +'</div>'
    +'<div class="dsec"><div class="dsec-t">'+t("pay")+'</div>'
    +'<div class="irow"><span class="ii">💳</span><div><div class="il">VietQR Global</div><div class="iv">'+flags+'</div></div></div>'
    +'<div class="irow"><span class="ii">📱</span><div><div class="il">'+t("pay")+'</div><div class="iv">VietQR · Cash · Visa/Master</div></div></div>'
    +'</div>'
    +'<div class="qhint">'+t("qn")+'</div>';
  showScr("Det");
}

function openMaps(lat,lng){ window.open("https://maps.google.com/maps?q="+lat+","+lng+"&z=17","_blank"); }
function doShare(id){ var p=PLACES.filter(function(x){return x.id===id;})[0]; if(navigator.share){navigator.share({title:getName(p),text:getName(p)+" - VietQR Global",url:location.href});}else{showToast("Copied!");} }

function togSave(id){
  var i=saved.indexOf(id);
  if(i>=0) saved.splice(i,1); else saved.push(id);
  try{localStorage.setItem("vqg_saved",JSON.stringify(saved));}catch(e){}
  updateBdg(); openDet(id);
}
function updateBdg(){
  var n=saved.length, el=document.getElementById("svBdg");
  el.textContent=n; el.style.display=n>0?"inline":"none";
}

function setQR(f,el){
  qrf=f;
  document.querySelectorAll("#qrChips .chip").forEach(function(c){c.classList.remove("on");});
  el.classList.add("on");
  renderPins(); renderBS();
}
function setCat(f,el){
  catf=f;
  document.querySelectorAll("#catChips .chip").forEach(function(c){c.classList.remove("on");});
  el.classList.add("on");
  renderList();
}
function onSrch(){ var v=document.getElementById("si").value; document.getElementById("clrBtn").style.display=v?"block":"none"; renderPins(); renderBS(); }
function clrSrch(){ document.getElementById("si").value=""; document.getElementById("clrBtn").style.display="none"; renderPins(); renderBS(); }

function renderList(){
  var q=(document.getElementById("lsi")||{value:""}).value.trim().toLowerCase();
  var list=PLACES.filter(function(p){
    if(qrf!=="all"&&p.qr.indexOf(qrf)<0) return false;
    if(catf!=="all"&&p.cat!==catf) return false;
    if(q&&getName(p).toLowerCase().indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){return dst({lat:uLat,lng:uLng},a)-dst({lat:uLat,lng:uLng},b);});
  document.getElementById("listSub").textContent=list.length+" "+t("ps");
  var cats=[]; list.forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  var html="";
  cats.forEach(function(c){
    html+='<div class="lsh">'+catLbl(c)+'</div>';
    html+=list.filter(function(p){return p.cat===c;}).map(pcHtml).join("");
  });
  document.getElementById("listBody").innerHTML=html||'<div style="padding:40px;text-align:center;color:var(--sub)">—</div>';
}

function doScan(){
  var s=[
    {t:"VietQR – Vietcombank",tags:["🇰🇷 KoQR","🇨🇳 UnionPay","🇸🇬 SGQR"],c:"#276749"},
    {t:"Alipay+ (China)",tags:["🇨🇳 Alipay","🇨🇳 WeChat Pay"],c:"#C53030"},
    {t:"PayPay (Japan)",tags:["🇯🇵 PayPay"],c:"#553C9A"},
    {t:"PromptPay (Thailand)",tags:["🇹🇭 PromptPay"],c:"#D69E2E"},
  ];
  var r=s[Math.floor(Math.random()*s.length)];
  document.getElementById("scanR").style.display="block";
  document.getElementById("srT").textContent="✅ "+r.t;
  document.getElementById("srT").style.color=r.c;
  document.getElementById("srTags").innerHTML=r.tags.map(function(tg){return '<span class="st">'+tg+'</span>';}).join("");
}

function renderSaved(){
  var list=PLACES.filter(function(p){return saved.indexOf(p.id)>=0;});
  document.getElementById("savedBody").innerHTML=list.length?list.map(pcHtml).join("")
    :'<div class="sv-empty"><div class="bi">⭐</div><p>'+t("noSv")+'</p></div>';
}

function navTo(s){
  ["Det","List","Scan","Saved"].forEach(function(n){document.getElementById("scr"+n).classList.add("off");});
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("on");});
  var nb=document.getElementById("nb"+s); if(nb) nb.classList.add("on");
  document.getElementById("nav").style.display="flex";
  curScr=s; prevScr=s;
  if(s==="List"){ renderList(); document.getElementById("scrList").classList.remove("off"); }
  else if(s==="Scan"){ document.getElementById("scrScan").classList.remove("off"); }
  else if(s==="Saved"){ renderSaved(); document.getElementById("scrSaved").classList.remove("off"); }
}

function showScr(s){
  document.getElementById("scr"+s).classList.remove("off");
  document.getElementById("nav").style.display="none";
  curScr=s;
}
function goBack(){
  document.getElementById("scr"+curScr).classList.add("off");
  document.getElementById("nav").style.display="flex";
  curScr=prevScr;
  document.querySelectorAll(".nb").forEach(function(b){b.classList.remove("on");});
  var nb=document.getElementById("nb"+prevScr); if(nb) nb.classList.add("on");
}

var mapExpanded=false;
function toggleMap(){
  var mw=document.getElementById("mapWrap");
  var btn=document.getElementById("toggleMapBtn");
  mapExpanded=!mapExpanded;
  mw.style.height=mapExpanded?"400px":"220px";
  btn.textContent=mapExpanded?"⬇️":"⬆️";
}

function locateMe(){
  showToast("📍...");
  if(!navigator.geolocation){showToast("No GPS");return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    uLat=pos.coords.latitude; uLng=pos.coords.longitude;
    renderPins(); renderBS(); showToast("✓");
  },function(){showToast("GPS error");},{timeout:6000});
}
function doRefresh(){ renderPins(); renderBS(); showToast("✓"); }

var tTimer;
function showToast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(tTimer);
  tTimer=setTimeout(function(){el.classList.remove("show");},2000);
}
</script>
